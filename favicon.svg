<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo escuro circular -->
  <rect width="100" height="100" rx="18" fill="#0a0e08"/>
  <!-- Elefante low-poly em tons de verde -->
  <g transform="translate(50 52) scale(0.55) translate(-50 -50)">
    <!-- Corpo -->
    <polygon points="20,55 42,40 65,42 78,55 82,68 75,82 60,80 45,82 32,80 22,72" fill="#1db584"/>
    <polygon points="42,40 55,32 65,42 60,52 50,50" fill="#10b981"/>
    <polygon points="55,32 70,30 78,42 65,42" fill="#0e7c5a"/>
    <!-- Cabeça -->
    <polygon points="70,30 88,38 92,52 85,60 78,55 78,42" fill="#1db584"/>
    <polygon points="78,55 85,60 88,72 80,75 75,68" fill="#0e7c5a"/>
    <!-- Orelha (destaque branco/claro) -->
    <polygon points="70,30 65,42 78,55 80,42" fill="#7a8a6a" opacity="0.55"/>
    <!-- Tromba -->
    <path d="M 88 52 Q 95 60, 92 70 Q 90 78, 95 82 L 92 86 Q 84 80, 86 70 Q 87 60, 84 56 Z" fill="#10b981"/>
    <!-- Presas -->
    <path d="M 86 70 Q 90 76, 88 82 L 84 80 Q 84 76, 84 72 Z" fill="#f7f3ea"/>
    <!-- Pernas -->
    <rect x="32" y="78" width="9" height="14" fill="#0e7c5a"/>
    <rect x="48" y="80" width="9" height="12" fill="#1db584"/>
    <rect x="62" y="78" width="9" height="14" fill="#0e7c5a"/>
    <rect x="74" y="78" width="9" height="14" fill="#1db584"/>
    <!-- Cauda -->
    <path d="M 22 60 Q 12 58, 10 50 L 12 52 Q 18 56, 22 65 Z" fill="#0e7c5a"/>
  </g>
</svg>
